name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate HTML syntax
        run: |
          which python3 && python3 -c "
import html.parser
import sys
with open('docs/index.html') as f:
    content = f.read()
    print('HTML file exists, size:', len(content), 'bytes')
"
      - name: Validate JS syntax
        run: |
          node --check docs/app.js && echo "app.js OK"
          node --check docs/licenses.js && echo "licenses.js OK"
